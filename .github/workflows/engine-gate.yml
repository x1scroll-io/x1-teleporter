name: Engine Gate — frozen instruments

# PROTECTED CI GATE (uneditable by the engine agent). Mr. Esters' rule:
# a phase merges ONLY IF the git diff on ALL instrument files is EMPTY and
# the golden oracle + unit suite pass. This workflow is the enforcement.
# The engine agent is FORBIDDEN from modifying this file, the instrument
# files, or the fixtures. If this gate fails, the phase does not merge.

on:
  pull_request:
    branches: [v2, feat/engine-phase1, feat/engine-phase2]
  push:
    branches: [feat/engine-phase1, feat/engine-phase2]

jobs:
  instrument-diff-gate:
    name: Instrument files untouched
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute base (merge-base with v2)
        id: base
        run: |
          git fetch origin v2 --depth=100 2>/dev/null || true
          BASE=$(git merge-base origin/v2 HEAD 2>/dev/null || echo "origin/v2")
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Merge base: $BASE"

      - name: Verify instrument diff is EMPTY
        run: |
          BASE="${{ steps.base.outputs.base }}"
          # The frozen rulers — a phase may NEVER touch these.
          INSTRUMENT_PATHS=(
            "test/golden.test.js"
            "test/goldenReverse.test.js"
            "test/fixtures/golden"
            "e2e/forward-leg.spec.js"
            "e2e/reverse-leg.spec.js"
            "e2e/helpers"
            "e2e/playwright.config.js"
            ".github/workflows/engine-gate.yml"
            ".github/workflows/ci.yml"
          )
          CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only "$BASE" HEAD)
          echo "Changed files vs base:"
          echo "$CHANGED" | sed 's/^/  /'
          VIOLATIONS=""
          for pat in "${INSTRUMENT_PATHS[@]}"; do
            HITS=$(echo "$CHANGED" | grep -E "^${pat}" || true)
            if [ -n "$HITS" ]; then
              VIOLATIONS="$VIOLATIONS
            $HITS"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::ENGINE GATE BLOCKED — instrument/fixture files were modified:"
            echo "$VIOLATIONS"
            echo "The engine agent may NEVER touch the rulers. Fix the ENGINE, not the oracle."
            exit 1
          fi
          echo "✅ Instrument diff EMPTY — gate passed."

  unit-and-golden:
    name: Unit suite + golden oracle
    runs-on: ubuntu-latest
    needs: instrument-diff-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Full unit suite (incl. golden oracle)
        run: npm test

      - name: Assert golden tests specifically ran and passed
        run: |
          # npm test output must show the golden files passing. The suite
          # failing anywhere aborts the job; this is a belt-and-suspenders
          # echo of what was covered.
          echo "Golden oracle covered by: npm test (test/golden*.test.js in the suite list)"
