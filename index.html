<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X1 Teleporter — Stables from any chain to any chain, including X1</title>
    <meta name="description" content="Bridge stablecoins from any chain to any chain, including X1. Powered by LI.FI." />
    <meta property="og:title" content="X1 Teleporter" />
    <meta property="og:description" content="Stables from any chain to any chain, including X1." />
    <meta property="og:url" content="https://x1teleporter.com/" />
    <meta name="theme-color" content="#05070d" />
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; background: #05070d; }
      * { box-sizing: border-box; }
    </style>
      <!-- DEV SHIM: browser deps reference Node's `process` (process.env/nextTick).
         Vite build replaces those refs, but `npm run dev` leaves them live and the
         app dies with "process is not defined" before React mounts. Dev-only:
         production bundles never evaluate this. -->
    <script>
      window.process = window.process || {
        env: {}, browser: true, version: "", platform: "browser",
        nextTick: function (fn) {
          var a = Array.prototype.slice.call(arguments, 1);
          setTimeout(function () { fn.apply(null, a); }, 0);
        },
      };
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
